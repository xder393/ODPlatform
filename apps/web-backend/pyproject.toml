[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "odp-api"
version = "0.1.0"
description = "ODPlatform quality inspection Web API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.110.0",
    "pypdf>=5.0.0",
    "redis>=5,<7",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.0.0",
    "SQLAlchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.112,<7",
    "httpx>=0.27.0",
    "pytest>=7.4.0",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/odp_api"]
