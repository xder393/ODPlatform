name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 平台核心引擎测试（保持原有内容不变）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install colorlog psutil pyyaml pydantic scikit-learn pillow pytest
          pip install -e ./apps/platform --no-deps

      - name: Run tests
        run: pytest -q

  # Web 后端（企业质检 API）测试
  backend-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install fastapi httpx pytest pydantic pydantic-settings pypdf psycopg
          pip install -e ./apps/platform --no-deps -e ./packages/shared-schemas --no-deps

      - name: Run tests
        run: pytest apps/web-backend/tests -q

  # Web 前端：单元测试 + 类型检查/构建 + E2E 规格类型检查
  frontend-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web-frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/web-frontend
        run: npm ci

      - name: Run unit tests
        working-directory: apps/web-frontend
        run: npm test

      - name: Type-check and build
        working-directory: apps/web-frontend
        run: npm run build

      - name: Type-check E2E specs
        working-directory: apps/web-frontend
        run: npm run typecheck:e2e

  # Playwright E2E：由 compose 拉起 api/nginx 全套服务后跑确定性闭环。
  # 注：本机无 docker，此 job 未在本地验证；是否一键跑通依赖并行实现的
  # deploy/compose.yaml（nginx 前端入口 8080、seed 与登录接口）。
  e2e:
    needs: [backend-web, frontend-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start services
        run: docker compose -f deploy/compose.yaml up -d --build

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web-frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/web-frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/web-frontend
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Dump compose logs
        if: always()
        run: docker compose -f deploy/compose.yaml logs

      - name: Tear down services
        if: always()
        run: docker compose -f deploy/compose.yaml down
