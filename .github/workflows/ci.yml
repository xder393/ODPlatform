name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 平台核心引擎测试（保持原有内容不变）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install colorlog psutil pyyaml pydantic scikit-learn pillow pytest
          pip install -e ./apps/platform --no-deps

      - name: Run tests
        run: pytest -q

  # Web 后端（企业质检 API）测试
  backend-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: odp
          POSTGRES_USER: odp
          POSTGRES_PASSWORD: odp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odp -d odp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ODP_MIGRATOR_DATABASE_URL: postgresql+psycopg://odp:odp@localhost:5432/odp
      ODP_POSTGRES_URL: postgresql://odp:odp@localhost:5432/odp
      ODP_POSTGRES_TEST_URL: postgresql+psycopg://odp:odp@localhost:5432/odp
      ODP_POSTGRES_APP_TEST_URL: postgresql+psycopg://odp_app:odp_app_dev@localhost:5432/odp
      ODP_ROLE_GATE_ADMIN_URL: postgresql+psycopg://odp:odp@localhost:5432/odp
      ODP_REDIS_TEST_URL: redis://localhost:6379/0
      ODP_MINIO_TEST_ENDPOINT: 127.0.0.1:29000
      ODP_MINIO_TEST_ACCESS_KEY: odp_task4
      ODP_MINIO_TEST_SECRET_KEY: odp-task4-local-test-only
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated MinIO test service
        run: |
          docker run -d --name odp-minio-test \
            -p 127.0.0.1:29000:9000 \
            -e MINIO_ROOT_USER="$ODP_MINIO_TEST_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$ODP_MINIO_TEST_SECRET_KEY" \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:29000/minio/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker logs odp-minio-test
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Verify backend dependency lock
        working-directory: apps/web-backend
        run: uv lock --check

      - name: Install dependencies
        run: |
          uv export --project apps/web-backend --frozen --extra dev --no-emit-project --output-file /tmp/odp-backend-requirements.txt
          pip install --require-hashes -r /tmp/odp-backend-requirements.txt
          pip install --no-deps -e ./apps/web-backend -e ./packages/shared-schemas

      - name: Upgrade a clean SQLite runtime schema
        run: |
          ODP_DATABASE_URL=sqlite:////tmp/odp-ci.db \
            bash -c 'cd apps/web-backend && alembic upgrade head'

      - name: Upgrade the PostgreSQL knowledge and business schemas
        run: |
          python -m odp_api.database_roles --bootstrap-only
          python -m odp_api.migrations
          ODP_DATABASE_URL="$ODP_POSTGRES_TEST_URL" \
            bash -c 'cd apps/web-backend && alembic upgrade head'
          python -m odp_api.database_roles
          ODP_DATABASE_URL="$ODP_POSTGRES_APP_TEST_URL" python -m odp_api.seed
          ODP_RETRIEVAL_BACKEND=pgvector ODP_POSTGRES_URL=postgresql://odp_app:odp_app_dev@localhost:5432/odp \
            python -m odp_api.seed_knowledge

      - name: Lint web backend
        run: ruff check apps/web-backend/src apps/web-backend/tests

      - name: Run tests
        run: pytest apps/web-backend/tests -q

      - name: Collect MinIO diagnostics and stop test service
        if: always()
        run: |
          docker logs odp-minio-test || true
          docker rm -f odp-minio-test || true

  # Web 前端：单元测试 + 类型检查/构建 + E2E 规格类型检查
  frontend-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web-frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/web-frontend
        run: npm ci

      - name: Run unit tests
        working-directory: apps/web-frontend
        run: npm test

      - name: Type-check and build
        working-directory: apps/web-frontend
        run: npm run build

      - name: Type-check E2E specs
        working-directory: apps/web-frontend
        run: npm run typecheck:e2e

      - name: Verify mandatory recorded E2E gate
        working-directory: apps/web-frontend
        run: npm run test:e2e-gate

  # Playwright E2E：由 compose 拉起 api/nginx 全套服务后跑确定性闭环。
  # Includes independently running recorded-video inference and browser disposition.
  e2e:
    needs: [backend-web, frontend-web]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: odp-ingestion-recovery-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f deploy/compose.yaml config --quiet

      - name: Start services
        run: docker compose -f deploy/compose.yaml up -d --build

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web-frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/web-frontend
        run: npx playwright install --with-deps chromium

      - name: Prepare and verify independent recorded pipeline
        timeout-minutes: 5
        run: |
          ready=0
          for i in $(seq 1 60); do
            if docker compose -f deploy/compose.yaml exec -T frame-ingestor python -c 'import cv2, numpy, odp_api' ; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          docker compose -f deploy/compose.yaml exec -T \
            -e ODP_ALLOW_COMPOSE_PROBE=disposable frame-ingestor \
            python /workspace/apps/web-backend/scripts/verify_compose_pipeline.py
          docker compose -f deploy/compose.yaml exec -T frame-ingestor python - <<'PY'
          import cv2
          import numpy as np
          path = "/tmp/odp-browser-e2e.avi"
          writer = cv2.VideoWriter(path, cv2.VideoWriter_fourcc(*"MJPG"), 5, (64, 64))
          if not writer.isOpened():
              raise RuntimeError("Unable to create recorded E2E video")
          try:
              frame = np.zeros((64, 64, 3), dtype=np.uint8)
              cv2.line(frame, (5, 5), (55, 55), (255, 255, 255), 2)
              writer.write(frame)
          finally:
              writer.release()
          capture = cv2.VideoCapture(path)
          try:
              ok, decoded = capture.read()
              if not ok or decoded is None:
                  raise RuntimeError("Recorded E2E video cannot be decoded")
          finally:
              capture.release()
          PY

      - name: Verify frame-ingestor crash recovery
        timeout-minutes: 8
        run: |
          state_path=/workspace/ingestion-recovery-state.json
          test ! -e ingestion-recovery-state.json
          docker compose -f deploy/compose.yaml exec -T \
            -e ODP_ALLOW_COMPOSE_PROBE=disposable frame-ingestor \
            python /workspace/apps/web-backend/scripts/verify_ingestor_recovery.py \
            prepare --state "$state_path"
          docker compose -f deploy/compose.yaml kill -s SIGKILL frame-ingestor
          docker compose -f deploy/compose.yaml up -d frame-ingestor

          # Dependency installation is a separate bound from lease recovery.
          # Do not invoke verify until the restarted container can import the
          # runtime modules used by the probe and process.
          ready=0
          for i in $(seq 1 120); do
            if docker compose -f deploy/compose.yaml exec -T frame-ingestor \
              python -c 'import cv2, numpy, odp_api'; then
              ready=1
              echo "restarted frame-ingestor dependencies are ready"
              break
            fi
            sleep 2
          done
          if test "$ready" != 1; then
            docker compose -f deploy/compose.yaml logs --no-color frame-ingestor
            exit 1
          fi
          docker compose -f deploy/compose.yaml exec -T \
            -e ODP_ALLOW_COMPOSE_PROBE=disposable frame-ingestor \
            python /workspace/apps/web-backend/scripts/verify_ingestor_recovery.py \
            verify --state "$state_path"

      - name: Run E2E tests
        working-directory: apps/web-frontend
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_RECORDED_SOURCE: /tmp/odp-browser-e2e.avi

      - name: Restart API and verify durable case history
        run: |
          docker compose -f deploy/compose.yaml restart api
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          base = "http://localhost:8080"
          login = Request(
              f"{base}/api/v1/auth/login",
              data=json.dumps({"email": "inspector@example.test", "password": "odp-inspector-dev"}).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          token = json.load(urlopen(login))["access_token"]
          cases = json.load(urlopen(Request(f"{base}/api/v1/cases", headers={"Authorization": f"Bearer {token}"})))
          assert any(case["status"] == "RESOLVED" and case["history"] for case in cases), cases
          PY

      - name: Dump compose logs
        if: always()
        run: |
          docker compose -f deploy/compose.yaml ps > compose-e2e-ps.log || true
          docker compose -f deploy/compose.yaml logs --no-color > compose-e2e.log || true

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          retention-days: 7
          path: |
            compose-e2e-ps.log
            compose-e2e.log
            apps/web-frontend/test-results/

      - name: Tear down services
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes --remove-orphans
