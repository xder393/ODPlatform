# ODPlatform inspection workbench: serves the built React app and proxies
# API/WebSocket traffic to the FastAPI service on the same origin.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe_access '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log safe_access;
    error_log /var/log/nginx/error.log crit;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Single-page app fallback.
        location / {
            try_files $uri /index.html;
        }

        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            access_log /var/log/nginx/websocket_access.log safe_access;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # Prometheus exposition is also proxied for operator convenience.
        location = /metrics {
            proxy_pass http://api:8000/metrics;
        }

        # Real upstream health probe (otherwise the SPA fallback answers 200).
        location = /healthz {
            proxy_pass http://api:8000/healthz;
        }
    }
}
