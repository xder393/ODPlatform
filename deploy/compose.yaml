x-p1-process: &p1-process
  # All P1 processes share the same source/image surface but have separate
  # PostgreSQL credentials and independent restart boundaries.  They do not
  # use the API's request lifecycle or a local SQLite task database.
  image: python:3.12-slim
  working_dir: /workspace
  volumes:
    - ..:/workspace
    - ../apps/web-backend/tests/fixtures:/workspace/apps/web-backend/tests/fixtures:ro
  environment: &p1-environment
    ODP_ENVIRONMENT: docker
    ODP_REDIS_URL: redis://redis:6379/0
    ODP_MINIO_ENDPOINT: minio:9000
    ODP_MINIO_ACCESS_KEY: minioadmin
    ODP_MINIO_SECRET_KEY: minioadmin
    ODP_MINIO_BUCKET: odp-artifacts
    ODP_MINIO_SECURE: "false"
    ODP_MINIO_REGION: us-east-1
    ODP_MODEL_PATH: /workspace/apps/web-backend/tests/fixtures/models/tiny-detector.onnx
    ODP_MODEL_SHA256: ${ODP_MODEL_SHA256:-210389bb2b3a8fa94645c41b10420eb4da318ac12a31b7708eda1e9c882f2922}
    ODP_EXECUTION_PROVIDER: CPUExecutionProvider
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
    storage-init:
      condition: service_completed_successfully

services:

  storage-init:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ..:/workspace:ro
    environment:
      ODP_MINIO_ENDPOINT: minio:9000
      ODP_MINIO_ACCESS_KEY: minioadmin
      ODP_MINIO_SECRET_KEY: minioadmin
      ODP_MINIO_BUCKET: odp-artifacts
      ODP_MINIO_SECURE: "false"
      ODP_MINIO_REGION: us-east-1
      PYTHONPATH: /workspace/apps/web-backend/src
    command: ["sh", "-c", "pip install 'minio>=7.2,<8' && python -m odp_api.storage_bootstrap"]
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: ["sh", "-c", "pip install -e /workspace/apps/web-backend -e /workspace/packages/shared-schemas && python -m odp_api.database_roles --bootstrap-only && python -m odp_api.migrations && (cd /workspace/apps/web-backend && alembic upgrade head) && python -m odp_api.database_roles && ODP_DATABASE_URL=$$ODP_RUNTIME_DATABASE_URL python -m odp_api.seed && ODP_DATABASE_URL=$$ODP_RUNTIME_DATABASE_URL python -m odp_api.seed_alerts && ODP_POSTGRES_URL=$$ODP_RUNTIME_POSTGRES_URL python -m odp_api.seed_knowledge"]
    environment:
      # Owner credentials remain compatible with existing postgres-data volumes.
      ODP_RUNTIME_DATABASE_URL: postgresql+psycopg://odp_app:odp_app_dev@postgres:5432/odp
      ODP_RUNTIME_POSTGRES_URL: postgresql://odp_app:odp_app_dev@postgres:5432/odp
      ODP_MIGRATOR_DATABASE_URL: postgresql+psycopg://odp:odp@postgres:5432/odp
      ODP_DATABASE_URL: postgresql+psycopg://odp:odp@postgres:5432/odp
      ODP_POSTGRES_URL: postgresql://odp:odp@postgres:5432/odp
      ODP_RETRIEVAL_BACKEND: pgvector
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: ["sh", "-c", "pip install -e /workspace/apps/web-backend -e /workspace/packages/shared-schemas && uvicorn odp_api.main:create_app --factory --host 0.0.0.0 --port 8000 --log-config /workspace/apps/web-backend/src/odp_api/observability/uvicorn_logging.json"]
    environment:
      ODP_ENVIRONMENT: docker
      ODP_REDIS_URL: redis://redis:6379/0
      ODP_DATABASE_URL: postgresql+psycopg://odp_api:odp_api_dev@postgres:5432/odp
      ODP_POSTGRES_URL: postgresql://odp_api:odp_api_dev@postgres:5432/odp
      ODP_MINIO_ENDPOINT: minio:9000
      ODP_MINIO_ACCESS_KEY: minioadmin
      ODP_MINIO_SECRET_KEY: minioadmin
      ODP_MINIO_BUCKET: odp-artifacts
      ODP_MINIO_SECURE: "false"
      ODP_MINIO_PUBLIC_ENDPOINT: ${ODP_MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      ODP_MINIO_PUBLIC_SECURE: ${ODP_MINIO_PUBLIC_SECURE:-false}
      ODP_MINIO_REGION: us-east-1
      ODP_RETRIEVAL_BACKEND: pgvector
      ODP_AUTH_JWT_SECRET: odp-dev-jwt-secret-do-not-reuse
      ODP_ENABLE_DEV_EVENT_TRIGGER: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frame-ingestor:
    <<: *p1-process
    environment:
      <<: *p1-environment
      ODP_PROCESS_ID: frame-ingestor
      ODP_DATABASE_URL: postgresql+psycopg://odp_worker:odp_worker_dev@postgres:5432/odp
    command: ["sh", "-c", "pip install -e /workspace/apps/web-backend -e /workspace/packages/shared-schemas && python -m odp_api.processes.frame_ingestor"]

  outbox-relay:
    <<: *p1-process
    environment:
      <<: *p1-environment
      ODP_PROCESS_ID: outbox-relay
      ODP_DATABASE_URL: postgresql+psycopg://odp_relay:odp_relay_dev@postgres:5432/odp
    command: ["sh", "-c", "pip install -e /workspace/apps/web-backend -e /workspace/packages/shared-schemas && python -m odp_api.processes.outbox_relay"]

  inference-worker-1:
    <<: *p1-process
    environment:
      <<: *p1-environment
      ODP_PROCESS_ID: inference-worker-1
      ODP_DATABASE_URL: postgresql+psycopg://odp_worker:odp_worker_dev@postgres:5432/odp
    command: ["sh", "-c", "pip install -e /workspace/apps/web-backend -e /workspace/packages/shared-schemas && python -m odp_api.processes.inference_worker"]

  inference-worker-2:
    <<: *p1-process
    environment:
      <<: *p1-environment
      ODP_PROCESS_ID: inference-worker-2
      ODP_DATABASE_URL: postgresql+psycopg://odp_worker:odp_worker_dev@postgres:5432/odp
    command: ["sh", "-c", "pip install -e /workspace/apps/web-backend -e /workspace/packages/shared-schemas && python -m odp_api.processes.inference_worker"]

  recovery-scheduler:
    <<: *p1-process
    environment:
      <<: *p1-environment
      ODP_PROCESS_ID: recovery-scheduler
      ODP_DATABASE_URL: postgresql+psycopg://odp_scheduler:odp_scheduler_dev@postgres:5432/odp
    command: ["sh", "-c", "pip install -e /workspace/apps/web-backend -e /workspace/packages/shared-schemas && python -m odp_api.processes.recovery_scheduler"]

  artifact-reconciler:
    <<: *p1-process
    environment:
      <<: *p1-environment
      ODP_PROCESS_ID: artifact-reconciler
      ODP_DATABASE_URL: postgresql+psycopg://odp_scheduler:odp_scheduler_dev@postgres:5432/odp
    command: ["sh", "-c", "pip install -e /workspace/apps/web-backend -e /workspace/packages/shared-schemas && python -m odp_api.processes.artifact_reconciler"]

  stream-retention:
    <<: *p1-process
    environment:
      <<: *p1-environment
      ODP_PROCESS_ID: stream-retention
      ODP_DATABASE_URL: postgresql+psycopg://odp_scheduler:odp_scheduler_dev@postgres:5432/odp
    command: ["sh", "-c", "pip install -e /workspace/apps/web-backend -e /workspace/packages/shared-schemas && python -m odp_api.processes.stream_retention"]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: odp
      POSTGRES_USER: odp
      POSTGRES_PASSWORD: odp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odp -d odp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

volumes:
  postgres-data:
