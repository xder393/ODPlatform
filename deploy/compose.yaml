services:
  migrate:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ..:/workspace
    command: ["sh", "-c", "pip install -e /workspace/apps/web-backend -e /workspace/packages/shared-schemas && python -m odp_api.database_roles --bootstrap-only && python -m odp_api.migrations && (cd /workspace/apps/web-backend && alembic upgrade head) && python -m odp_api.database_roles && ODP_DATABASE_URL=$$ODP_RUNTIME_DATABASE_URL python -m odp_api.seed && ODP_POSTGRES_URL=$$ODP_RUNTIME_POSTGRES_URL python -m odp_api.seed_knowledge"]
    environment:
      # Owner credentials remain compatible with existing postgres-data volumes.
      ODP_RUNTIME_DATABASE_URL: postgresql+psycopg://odp_app:odp_app_dev@postgres:5432/odp
      ODP_RUNTIME_POSTGRES_URL: postgresql://odp_app:odp_app_dev@postgres:5432/odp
      ODP_MIGRATOR_DATABASE_URL: postgresql+psycopg://odp:odp@postgres:5432/odp
      ODP_DATABASE_URL: postgresql+psycopg://odp:odp@postgres:5432/odp
      ODP_POSTGRES_URL: postgresql://odp:odp@postgres:5432/odp
      ODP_RETRIEVAL_BACKEND: pgvector
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ..:/workspace
      - task-state:/data
    command: ["sh", "-c", "pip install -e /workspace/apps/web-backend -e /workspace/packages/shared-schemas && uvicorn odp_api.main:create_app --factory --host 0.0.0.0 --port 8000 --log-config /workspace/apps/web-backend/src/odp_api/observability/uvicorn_logging.json"]
    environment:
      ODP_ENVIRONMENT: docker
      ODP_REDIS_URL: redis://redis:6379/0
      ODP_DATABASE_URL: postgresql+psycopg://odp_app:odp_app_dev@postgres:5432/odp
      ODP_POSTGRES_URL: postgresql://odp_app:odp_app_dev@postgres:5432/odp
      ODP_TASK_DATABASE_PATH: /data/odp-tasks.sqlite3
      ODP_RETRIEVAL_BACKEND: pgvector
      ODP_AUTH_JWT_SECRET: odp-dev-jwt-secret-do-not-reuse
      ODP_ENABLE_DEV_EVENT_TRIGGER: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: odp
      POSTGRES_USER: odp
      POSTGRES_PASSWORD: odp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odp -d odp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

volumes:
  task-state:
  postgres-data:
