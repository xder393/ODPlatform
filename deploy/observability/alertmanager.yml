global:
  resolve_timeout: 5m

route:
  receiver: demo-webhook
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: demo-webhook
    webhook_configs:
      # Demo-only receiver: posts to the API health endpoint, which is a no-op.
      # Production deployments must replace this with Slack, PagerDuty,
      # Opsgenie or an on-call webhook.
      - url: http://api:8000/healthz
        send_resolved: true
